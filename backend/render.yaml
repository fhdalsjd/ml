services:
  # Web Service - FastAPI Backend
  - type: web
    name: trading-journal-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-journal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-url.com,http://localhost:3000
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: trading-journal-db
    databaseName: trading_journal
    plan: starter
    region: oregon
    ipAllowList: []
